[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdguard-platform"
version = "0.1.0"
description = "CrowdGuard settings, SQLite repositories, S3 object store, audit"
requires-python = ">=3.10"
dependencies = ["crowdguard-contracts", "boto3>=1.34"]

[project.optional-dependencies]
test = ["moto[s3,server]>=5.0", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["crowdguard_platform*"]

[tool.setuptools.package-data]
crowdguard_platform = ["migrations/*.sql"]
