[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdguard-api"
version = "0.1.0"
description = "CrowdGuard FastAPI service (never imports the crowdguard core)"
requires-python = ">=3.10"
dependencies = ["crowdguard-contracts", "crowdguard-platform", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["httpx>=0.27", "moto[s3,server]>=5.0", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["crowdguard_api*"]
