[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdguard-contracts"
version = "0.1.0"
description = "Shared CrowdGuard data contracts (pydantic only)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["crowdguard_contracts*"]
